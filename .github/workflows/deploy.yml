name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        run: |
          # Write key to file
          echo "${{ secrets.VPS_SSH_KEY }}" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key

          # Verify key is valid
          ssh-keygen -l -f /tmp/deploy_key

          # Connect and deploy
          ssh -i /tmp/deploy_key \
              -o StrictHostKeyChecking=no \
              -o PasswordAuthentication=no \
              ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
              "cd /var/www/ledgerone_erp && git pull origin main"

          # Clean up key
          rm /tmp/deploy_key